name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Testes (lógica + validação dos arquivos de queries/regras)
        run: python -m pytest
      - name: Demo ponta a ponta
        run: |
          mkdir -p out
          python -m portscan_detection generate --output out/synthetic.csv
          python -m portscan_detection detect --input out/synthetic.csv --format json --output out/alerts.json
