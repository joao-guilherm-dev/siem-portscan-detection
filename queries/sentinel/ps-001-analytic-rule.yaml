id: 7c1d2e3f-4a5b-4c6d-8e9f-0a1b2c3d4e5f
name: PS-001 - Port scan vertical (múltiplas portas em um destino)
description: |
  Origem tentou conexão em 20+ portas distintas de um mesmo destino em poucos minutos, com alta taxa de bloqueio.
  Indica reconhecimento ativo (T1046 interno / T1595.001 externo). Falsos positivos reduzidos por: allowlist
  (watchlist PortScanAllowlist), exceção por serviço, descarte de multicast/broadcast e taxa mínima de bloqueio.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: CefAma
    dataTypes:
      - CommonSecurityLog
queryFrequency: 5m
queryPeriod: 6m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Reconnaissance
  - Discovery
relevantTechniques:
  - T1595
  - T1046
query: |
  let min_ports = 20;
  let min_events = 20;
  let min_block_ratio = 0.5;
  let AllowRanges = toscalar(_GetWatchlist('PortScanAllowlist') | summarize make_list(SearchKey));
  CommonSecurityLog
  | where isnotempty(SourceIP) and isnotempty(DestinationIP) and DestinationPort > 0
  | where not(ipv4_is_in_range(DestinationIP, "224.0.0.0/4")) and DestinationIP != "255.255.255.255" and not(ipv4_is_in_range(DestinationIP, "169.254.0.0/16"))
  | where not(ipv4_is_in_any_range(SourceIP, AllowRanges))
  | where not(ipv4_is_in_range(SourceIP, "10.10.70.2/32") and DestinationPort in (443, 8443))
  | extend Blocked = iff(DeviceAction has_any ("deny", "drop", "block", "reject", "reset"), 1, 0)
  | summarize Events = count(), DistinctPorts = dcount(DestinationPort), Blocked = sum(Blocked),
              SamplePorts = make_set(DestinationPort, 10), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated)
              by SourceIP, DestinationIP
  | extend BlockedRatio = round(todouble(Blocked) / Events, 2)
  | where DistinctPorts >= min_ports and Events >= min_events and BlockedRatio >= min_block_ratio
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIP
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: DestinationIP
alertDetailsOverride:
  alertDisplayNameFormat: "Port scan de {{SourceIP}} contra {{DestinationIP}} ({{DistinctPorts}} portas)"
eventGroupingSettings:
  aggregationKind: AlertPerResult
suppressionEnabled: true
suppressionDuration: 15m
version: 1.0.0
kind: Scheduled
